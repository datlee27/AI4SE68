<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="layout :: head">
    <title id="pageTitle">Nutrition Goals & Tracking</title>
</head>
<body>
    <div id="content">
        <div class="nutrition-header">
            <h1>Nutrition Tracking</h1>
        </div>

        <div class="dashboard">
            <!-- Nutrition Goals Card -->
            <div class="card">
                <div class="card-header">
                    <h2 class="card-title">Daily Goals</h2>
                    <button class="btn btn-primary" onclick="showGoalsModal()">Edit Goals</button>
                </div>
                <div class="card-content">
                    <div class="nutrition-item">
                        <span>Calories</span>
                        <div class="progress-bar">
                            <div class="progress-bar-fill" th:style="'width: ' + ${(todayNutrition.calories / goals.calories * 100)} + '%'"></div>
                        </div>
                        <span th:text="${todayNutrition.calories + ' / ' + goals.calories}">0/2000</span>
                    </div>
                    <div class="nutrition-item">
                        <span>Protein</span>
                        <div class="progress-bar">
                            <div class="progress-bar-fill" th:style="'width: ' + ${(todayNutrition.protein / goals.protein * 100)} + '%'"></div>
                        </div>
                        <span th:text="${todayNutrition.protein + 'g / ' + goals.protein + 'g'}">0/150g</span>
                    </div>
                    <div class="nutrition-item">
                        <span>Carbs</span>
                        <div class="progress-bar">
                            <div class="progress-bar-fill" th:style="'width: ' + ${(todayNutrition.carbs / goals.carbs * 100)} + '%'"></div>
                        </div>
                        <span th:text="${todayNutrition.carbs + 'g / ' + goals.carbs + 'g'}">0/250g</span>
                    </div>
                    <div class="nutrition-item">
                        <span>Fats</span>
                        <div class="progress-bar">
                            <div class="progress-bar-fill" th:style="'width: ' + ${(todayNutrition.fats / goals.fats * 100)} + '%'"></div>
                        </div>
                        <span th:text="${todayNutrition.fats + 'g / ' + goals.fats + 'g'}">0/65g</span>
                    </div>
                </div>
            </div>

            <!-- Weekly Summary -->
            <div class="card">
                <div class="card-header">
                    <h2 class="card-title">Weekly Summary</h2>
                </div>
                <div class="card-content">
                    <div class="chart-container">
                        <canvas id="weeklyChart"></canvas>
                    </div>
                </div>
            </div>

            <!-- Water Tracking -->
            <div class="card">
                <div class="card-header">
                    <h2 class="card-title">Water Intake</h2>
                    <button class="btn btn-primary" onclick="showWaterModal()">Add Water</button>
                </div>
                <div class="card-content">
                    <div class="water-progress">
                        <div class="progress-bar">
                            <div class="progress-bar-fill" th:style="'width: ' + ${(waterIntake / 2000 * 100)} + '%'"></div>
                        </div>
                        <span th:text="${waterIntake + 'ml / 2000ml'}">0ml/2000ml</span>
                    </div>
                    <div class="water-history">
                        <h3>Today's Entries</h3>
                        <ul>
                            <li th:each="entry : ${waterEntries}" 
                                th:text="${#temporals.format(entry.time, 'HH:mm') + ' - ' + entry.amount + 'ml'}">
                                09:00 - 250ml
                            </li>
                        </ul>
                    </div>
                </div>
            </div>

            <!-- Nutritional Tips -->
            <div class="card">
                <div class="card-header">
                    <h2 class="card-title">Nutrition Tips</h2>
                </div>
                <div class="card-content">
                    <div class="tips-list">
                        <div class="tip" th:each="tip : ${nutritionTips}">
                            <h3 th:text="${tip.title}">Tip Title</h3>
                            <p th:text="${tip.content}">Tip content goes here</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Nutrition Goals Modal -->
        <div id="goalsModal" class="modal">
            <div class="modal-content">
                <span class="modal-close">&times;</span>
                <h2>Set Nutrition Goals</h2>
                <form th:action="@{/nutrition/goals}" method="post">
                    <div class="form-group">
                        <label class="form-label" for="calories">Daily Calories</label>
                        <input type="number" id="calories" name="calories" class="form-input" 
                               th:value="${goals.calories}" min="0" step="50" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="protein">Protein (g)</label>
                        <input type="number" id="protein" name="protein" class="form-input" 
                               th:value="${goals.protein}" min="0" step="5" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="carbs">Carbohydrates (g)</label>
                        <input type="number" id="carbs" name="carbs" class="form-input" 
                               th:value="${goals.carbs}" min="0" step="5" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="fats">Fats (g)</label>
                        <input type="number" id="fats" name="fats" class="form-input" 
                               th:value="${goals.fats}" min="0" step="5" required>
                    </div>
                    <button type="submit" class="btn btn-primary">Save Goals</button>
                </form>
            </div>
        </div>

        <!-- Water Tracking Modal -->
        <div id="waterModal" class="modal">
            <div class="modal-content">
                <span class="modal-close">&times;</span>
                <h2>Track Water Intake</h2>
                <form th:action="@{/water/track}" method="post">
                    <div class="form-group">
                        <label class="form-label" for="amount">Amount (ml)</label>
                        <input type="number" id="amount" name="amount" class="form-input" 
                               min="0" step="50" value="250" required>
                    </div>
                    <button type="submit" class="btn btn-primary">Save</button>
                </form>
            </div>
        </div>
    </div>

    <!-- Chart.js for visualizations -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script th:inline="javascript">
        // Weekly nutrition data from Thymeleaf
        const weeklyData = /*[[${weeklyData}]]*/ [];
        
        // Create weekly chart
        const ctx = document.getElementById('weeklyChart').getContext('2d');
        new Chart(ctx, {
            type: 'line',
            data: {
                labels: weeklyData.map(d => d.date),
                datasets: [
                    {
                        label: 'Calories',
                        data: weeklyData.map(d => d.calories),
                        borderColor: '#4CAF50',
                        tension: 0.1
                    },
                    {
                        label: 'Protein',
                        data: weeklyData.map(d => d.protein),
                        borderColor: '#2196F3',
                        tension: 0.1
                    }
                ]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: {
                    legend: {
                        position: 'top'
                    }
                }
            }
        });

        // Modal functions
        function showGoalsModal() {
            document.getElementById('goalsModal').style.display = 'block';
        }

        function showWaterModal() {
            document.getElementById('waterModal').style.display = 'block';
        }

        // Close modals
        document.querySelectorAll('.modal-close').forEach(function(closeBtn) {
            closeBtn.addEventListener('click', function() {
                this.closest('.modal').style.display = 'none';
            });
        });

        window.addEventListener('click', function(event) {
            if (event.target.classList.contains('modal')) {
                event.target.style.display = 'none';
            }
        });
    </script>
</body>
</html>
