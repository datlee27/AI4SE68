<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meal Planner - Home</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <div class="container mt-4">
        <h1 class="text-center mb-4">Welcome to Meal Planner</h1>
        
        <div class="row">
            <!-- Today's Summary -->
            <div class="col-md-6">
                <div class="card">
                    <div class="card-header">
                        <h5 class="card-title mb-0">Today's Summary</h5>
                    </div>
                    <div class="card-body">
                        <div class="row">
                            <div class="col-6">
                                <div class="nutrition-card calories p-2 mb-2">
                                    <h6>Calories</h6>
                                    <p class="h4">1200/2000</p>
                                </div>
                            </div>
                            <div class="col-6">
                                <div class="nutrition-card protein p-2 mb-2">
                                    <h6>Protein</h6>
                                    <p class="h4">65g/150g</p>
                                </div>
                            </div>
                            <div class="col-6">
                                <div class="nutrition-card carbs p-2">
                                    <h6>Carbs</h6>
                                    <p class="h4">150g/250g</p>
                                </div>
                            </div>
                            <div class="col-6">
                                <div class="nutrition-card fats p-2">
                                    <h6>Fats</h6>
                                    <p class="h4">40g/65g</p>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Quick Actions -->
            <div class="col-md-6">
                <div class="card">
                    <div class="card-header">
                        <h5 class="card-title mb-0">Quick Actions</h5>
                    </div>
                    <div class="card-body">
                        <a href="/meals/add" class="btn btn-meal btn-lg w-100 mb-3">
                            Add Meal
                        </a>
                        <a href="/water/add" class="btn btn-primary btn-lg w-100 mb-3">
                            Track Water
                        </a>
                        <a href="/shopping-list" class="btn btn-secondary btn-lg w-100">
                            Shopping List
                        </a>
                    </div>
                </div>
            </div>
        </div>

        <!-- Water Intake -->
        <div class="card mt-4">
            <div class="card-header">
                <h5 class="card-title mb-0">Water Intake</h5>
            </div>
            <div class="card-body">
                <div class="progress water-progress">
                    <div class="progress-bar" role="progressbar" style="width: 60%;" 
                         aria-valuenow="60" aria-valuemin="0" aria-valuemax="100">
                        1.5L / 2.5L
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
