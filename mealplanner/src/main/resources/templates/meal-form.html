<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Meal - Meal Planner</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="/">Meal Planner</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/}">Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" th:href="@{/meals}">Meals</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/nutrition}">Nutrition</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/shopping-list}">Shopping List</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card">
                    <div class="card-header">
                        <h5 class="card-title mb-0">Add New Meal</h5>
                    </div>
                    <div class="card-body">
                        <form th:action="@{/meals/add}" method="post">
                            <input type="hidden" name="userId" value="1">
                            
                            <div class="mb-3">
                                <label for="date" class="form-label">Date</label>
                                <input type="date" class="form-control" id="date" name="date" 
                                       th:value="${today}" required>
                            </div>

                            <div class="mb-3">
                                <label for="mealType" class="form-label">Meal Type</label>
                                <select class="form-select" id="mealType" name="mealType" required>
                                    <option value="">Select meal type</option>
                                    <option th:each="type : ${mealTypes}"
                                            th:value="${type}"
                                            th:text="${type}">BREAKFAST</option>
                                </select>
                            </div>

                            <div class="mb-3">
                                <label for="foods" class="form-label">Foods</label>
                                <select class="form-select" id="foods" name="foods" multiple required>
                                    <option value="1">Chicken Breast</option>
                                    <option value="2">Brown Rice</option>
                                    <option value="3">Broccoli</option>
                                    <option value="4">Sweet Potato</option>
                                </select>
                                <small class="form-text text-muted">Hold Ctrl/Cmd to select multiple foods</small>
                            </div>

                            <button type="submit" class="btn btn-primary">Add Meal</button>
                            <a href="/meals" class="btn btn-secondary">Cancel</a>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
