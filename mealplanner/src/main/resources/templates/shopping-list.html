<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="layout :: head">
    <title id="pageTitle">Shopping List</title>
</head>
<body>
    <div id="content">
        <div class="shopping-header">
            <h1>Shopping List</h1>
            <div class="shopping-actions">
                <button class="btn btn-primary" onclick="showAddItemModal()">Add Item</button>
                <button class="btn" onclick="printList()">Print List</button>
            </div>
        </div>

        <!-- Shopping List Categories -->
        <div class="shopping-container">
            <!-- Filter Section -->
            <div class="filters card">
                <h2>Filters</h2>
                <div class="form-group">
                    <label class="form-label" for="weekSelect">Week</label>
                    <select id="weekSelect" class="form-input" onchange="changeWeek(this.value)">
                        <option th:each="week : ${availableWeeks}" 
                                th:value="${week.number}" 
                                th:text="${week.label}"
                                th:selected="${week.number == currentWeek}">
                            Week Label
                        </option>
                    </select>
                </div>
                <div class="form-group">
                    <label class="form-label" for="categoryFilter">Category</label>
                    <select id="categoryFilter" class="form-input" onchange="filterByCategory(this.value)">
                        <option value="">All Categories</option>
                        <option th:each="category : ${categories}" 
                                th:value="${category}"
                                th:text="${category}">Category Name</option>
                    </select>
                </div>
            </div>

            <!-- Shopping List Content -->
            <div class="shopping-list-content">
                <div th:each="category : ${groupedItems}" class="category-section card">
                    <div class="card-header">
                        <h2 class="card-title" th:text="${category.key}">Category Name</h2>
                    </div>
                    <div class="card-content">
                        <ul class="shopping-items">
                            <li th:each="item : ${category.value}" class="shopping-item">
                                <div class="item-check">
                                    <input type="checkbox" th:id="'item-' + ${item.id}"
                                           th:checked="${item.checked}"
                                           onchange="toggleItem(this)">
                                    <label th:for="'item-' + ${item.id}" 
                                           th:text="${item.name}"
                                           th:class="${item.checked ? 'checked' : ''}">
                                        Item Name
                                    </label>
                                </div>
                                <div class="item-quantity" th:text="${item.quantity}">Quantity</div>
                                <div class="item-actions">
                                    <button class="btn" onclick="editItem(this)">Edit</button>
                                    <button class="btn" onclick="deleteItem(this)">Delete</button>
                                </div>
                            </li>
                        </ul>
                    </div>
                </div>
            </div>
        </div>

        <!-- Add/Edit Item Modal -->
        <div id="itemModal" class="modal">
            <div class="modal-content">
                <span class="modal-close">&times;</span>
                <h2 id="modalTitle">Add Shopping Item</h2>
                <form id="itemForm" th:action="@{/shopping-list/save}" method="post">
                    <input type="hidden" id="itemId" name="id">
                    <div class="form-group">
                        <label class="form-label" for="itemName">Item Name</label>
                        <input type="text" id="itemName" name="name" class="form-input" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="itemQuantity">Quantity</label>
                        <div class="quantity-input">
                            <input type="number" id="itemQuantity" name="quantity" class="form-input" min="1" value="1">
                            <select id="itemUnit" name="unit" class="form-input">
                                <option value="pcs">pcs</option>
                                <option value="kg">kg</option>
                                <option value="g">g</option>
                                <option value="l">l</option>
                                <option value="ml">ml</option>
                            </select>
                        </div>
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="itemCategory">Category</label>
                        <select id="itemCategory" name="category" class="form-input" required>
                            <option value="">Select Category</option>
                            <option th:each="category : ${categories}" 
                                    th:value="${category}"
                                    th:text="${category}">Category Name</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="itemNote">Note (Optional)</label>
                        <textarea id="itemNote" name="note" class="form-input" rows="2"></textarea>
                    </div>
                    <button type="submit" class="btn btn-primary">Save Item</button>
                </form>
            </div>
        </div>
    </div>

    <script th:inline="javascript">
        function showAddItemModal() {
            const modal = document.getElementById('itemModal');
            const form = document.getElementById('itemForm');
            const modalTitle = document.getElementById('modalTitle');
            
            modalTitle.textContent = 'Add Shopping Item';
            form.reset();
            
            modal.style.display = 'block';
        }

        function editItem(button) {
            const itemId = button.closest('.shopping-item').querySelector('input[type="checkbox"]').id.replace('item-', '');
            const modal = document.getElementById('itemModal');
            const modalTitle = document.getElementById('modalTitle');
            
            modalTitle.textContent = 'Edit Shopping Item';
            
            // Fetch item data and populate form
            fetch(`/shopping-list/item/${itemId}`)
                .then(response => response.json())
                .then(item => {
                    document.getElementById('itemId').value = item.id;
                    document.getElementById('itemName').value = item.name;
                    document.getElementById('itemQuantity').value = item.quantity;
                    document.getElementById('itemUnit').value = item.unit;
                    document.getElementById('itemCategory').value = item.category;
                    document.getElementById('itemNote').value = item.note || '';
                });
            
            modal.style.display = 'block';
        }

        function deleteItem(button) {
            const itemId = button.closest('.shopping-item').querySelector('input[type="checkbox"]').id.replace('item-', '');
            
            if (confirm('Are you sure you want to delete this item?')) {
                fetch(`/shopping-list/item/${itemId}`, { method: 'DELETE' })
                    .then(response => {
                        if (response.ok) {
                            window.location.reload();
                        }
                    });
            }
        }

        function toggleItem(checkbox) {
            const itemId = checkbox.id.replace('item-', '');
            const checked = checkbox.checked;
            
            fetch(`/shopping-list/item/${itemId}/toggle`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({ checked })
            }).then(response => {
                if (response.ok) {
                    const label = checkbox.nextElementSibling;
                    if (checked) {
                        label.classList.add('checked');
                    } else {
                        label.classList.remove('checked');
                    }
                }
            });
        }

        function changeWeek(weekNumber) {
            window.location.href = `/shopping-list?week=${weekNumber}`;
        }

        function filterByCategory(category) {
            const sections = document.querySelectorAll('.category-section');
            if (category === '') {
                sections.forEach(section => section.style.display = 'block');
            } else {
                sections.forEach(section => {
                    if (section.querySelector('.card-title').textContent === category) {
                        section.style.display = 'block';
                    } else {
                        section.style.display = 'none';
                    }
                });
            }
        }

        function printList() {
            window.print();
        }

        // Modal close handlers
        document.querySelector('.modal-close').addEventListener('click', function() {
            document.getElementById('itemModal').style.display = 'none';
        });

        window.addEventListener('click', function(event) {
            const modal = document.getElementById('itemModal');
            if (event.target == modal) {
                modal.style.display = 'none';
            }
        });
    </script>
</body>
</html>
