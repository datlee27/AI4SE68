<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Track Water - Meal Planner</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="/">Meal Planner</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/}">Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/meals}">Meals</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/nutrition}">Nutrition</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/shopping-list}">Shopping List</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card">
                    <div class="card-header">
                        <h5 class="card-title mb-0">Track Water Intake</h5>
                    </div>
                    <div class="card-body">
                        <form th:action="@{/water/add}" method="post">
                            <input type="hidden" name="userId" value="1">
                            
                            <div class="mb-3">
                                <label for="date" class="form-label">Date</label>
                                <input type="date" class="form-control" id="date" name="date" 
                                       th:value="${today}" required>
                            </div>

                            <div class="mb-3">
                                <label for="amount" class="form-label">Amount (ml)</label>
                                <input type="number" class="form-control" id="amount" name="amount" 
                                       min="0" step="100" required>
                                <div class="form-text">Common amounts:
                                    <button type="button" class="btn btn-link p-0" onclick="setAmount(250)">250ml</button>,
                                    <button type="button" class="btn btn-link p-0" onclick="setAmount(500)">500ml</button>,
                                    <button type="button" class="btn btn-link p-0" onclick="setAmount(1000)">1000ml</button>
                                </div>
                            </div>

                            <button type="submit" class="btn btn-primary">Track Water</button>
                            <a href="/" class="btn btn-secondary">Cancel</a>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        function setAmount(value) {
            document.getElementById('amount').value = value;
        }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
